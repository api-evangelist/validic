source: https://trust.validic.com/ (Atlassian Statuspage) + https://developer.validic.com/
description: >-
  Versioning, status and deprecation posture for the Validic Inform platform.
  Validic runs a public, component-level status page and versions its API in
  the hostname (api.v2.validic.com / streams.v2.validic.com, ReadMe project
  version 2.0). It publishes no written deprecation policy and sends no
  Sunset/Deprecation headers, but it does track end-of-life of its own Mobile
  SDK generations and of upstream device sources as status-page components and
  scheduled maintenance events.
versioning:
  scheme: host-and-path major version
  current_version: '2.0'
  evidence:
  - https://api.v2.validic.com
  - https://streams.v2.validic.com
  - ReadMe project version "2.0" (developer.validic.com, branch /branches/2.0/)
  notes: >-
    The major version is carried in the host label (`v2`), not in a header or a
    URL path segment. The OpenAPI documents Validic publishes both declare
    info.version "2.0". There is no documented version-negotiation header and
    no dated/calendar versioning.
  legacy:
  - name: Inform Mobile SDK 1.x.x
    status: legacy
    evidence: >-
      Status page carries "Legacy SDK (1.x.x)" as a component distinct from
      "Inform SDK (2.x.x)", and the docs publish migration guides for iOS,
      Android and Cordova ("Migrating from the v1.x.x SDK to the Inform SDK
      (v2.x.x)").
    migration_guide: https://developer.validic.com/docs/migrating-from-v1-to-inform-sdk
  - name: helpdocs.validic.com
    status: superseded
    evidence: >-
      Older documentation links inside the current docs still point at
      helpdocs.validic.com; the live portal is developer.validic.com.
