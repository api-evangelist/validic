deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  evidence: >-
    No deprecation or sunset policy page exists on developer.validic.com; no
    operation in either published OpenAPI carries `deprecated: true`; no
    Sunset or Deprecation response header is documented anywhere in the API
    reference.
  practice: >-
    Deprecation is communicated as prose in the release notes and as scheduled
    maintenance on the status page rather than as a policy or a response
    header. Two live examples at time of writing - the Fitbit source is being
    migrated to the Google Health API with published key dates, and the
    Under Armour source type was renamed to MapMyFitness (changelog, 2025-02-05).
  gap: >-
    An agent calling this API has no runtime signal that an operation, a metric
    or a device source is going away. This is the highest-value operational
    gap on the profile: the information exists, it just is not machine-readable.
sla:
  published: false
  url: null
  note: >-
    No public SLA or uptime commitment. The free developer tier explicitly
    disclaims one - "No-fee developer access - no SLA, no uptime guarantee"
    (https://dashboard.validic.com/validic-developer-signup.txt). Production
    SLAs are set in the enterprise agreement.
