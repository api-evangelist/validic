description: >-
  Validic's client-library estate splits cleanly in two. The SUPPORTED half is
  the Inform Mobile SDK (v2.x) for iOS, Android and Cordova - genuinely
  first-party and actively maintained, but distributed from a CREDENTIALED
  private Artifactory instance (validic.jfrog.io), so it has no public registry
  metadata and no publicly readable version or release date. The PUBLIC half is
  a set of server-side REST wrappers on GitHub, all of which the company has
  archived; the newest public release is from 2016.
summary:
  official_packages: 8
  publicly_installable: 3
  publicly_installable_and_maintained: 0
  gated_behind_credentials: 5
  latest_public_release: '2016-12-19'
  note: >-
    Every server-side SDK a developer can install without contacting Validic
    is archived and roughly a decade old, and predates the v2 Inform API those
    developers are being pointed at. The maintained SDKs are mobile-only and
    require an Artifactory account. There is no supported public
    Python / Node / Ruby / PHP / Go / Java client for the current API.
