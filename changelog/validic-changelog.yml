observations:
- >-
  Change is overwhelmingly data-model change, not interface change. Nineteen of
  twenty entries add or rename METRICS and SOURCE TYPES; not one changes a
  path, a parameter or an auth mechanism. That is the signature of a
  normalisation platform - the contract is stable and the vocabulary underneath
  it moves.
- >-
  The two genuinely breaking changes are both source-type RENAMES (nokia ->
  withings in 2020, under_armour -> mapmyfitness in 2025), and both were
  announced with a date. Any consumer string-matching on `source.type` should
  treat that field as a moving vocabulary.
- >-
  Validic gave notice ahead of each change, but delivered it only as prose.
  Neither the deprecation of Dexcom Intraday nor the deprecation of peak_flow
  is expressed anywhere machine readable - no `deprecated: true` in the
  OpenAPI, no Sunset header. See lifecycle/validic-lifecycle.yml.
