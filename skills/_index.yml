cross_cutting_rules:
  auth: '?token=ORG_TOKEN as a query parameter on Inform; Authorization: <id_token> on signup'
  envelope: 'lists wrap in { "data": [...] }; single resources do not'
  identifiers: 'use uid in URLs, never id - id produces a silent 404'
  date_window: 30 days per request (agent guide says 31; page at 30)
  rate_limit: 2,000 requests per token per hour, with no runtime header
  idempotency: none on requests; consumer must de-duplicate stream redelivery
  phi: uid must never contain identifying data
  see:
  - conventions/validic-conventions.yml
  - errors/validic-problem-types.yml
  - rate-limits/validic-rate-limits.yml
  - agentic-access/validic-agentic-access.yml
