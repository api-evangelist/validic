- path: https://trust.validic.com/.well-known/security.txt
  status: 200
  bytes: 1448
  owner: Atlassian
  credited_to_validic: false
  reason: >-
    This is a real, PGP-signed RFC 9116 document, but it is NOT Validic's. It
    is served by the Atlassian Statuspage platform that trust.validic.com is
    CNAME'd to (trust.validic.com -> qtyl0stcbvvr.stspg-customer.com). Its own
    fields say so plainly - Contact
    https://www.atlassian.com/trust/security/report-a-vulnerability, Contact
    mailto:security@atlassian.com, Policy on atlassian.com, and an explicit
    `Canonical: https://www.atlassian.com/.well-known/security.txt`. Crediting
    it to Validic would be the venue-as-provider error: it would score Validic
    for a vulnerability-disclosure program run by its status-page vendor. Not
    saved to disk and no SecurityTxt pointer emitted.
