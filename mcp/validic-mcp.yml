notes:
  tool_count: 22
  auth_model: >-
    Any real server would carry the organization token, and the token is
    org-scoped - it can read every user in the organization. Because those
    users are patients, a Validic MCP server is a PHI-bearing surface and
    scoping to a single uid per session is the only defensible default.
  input_schemas: >-
    Real inputSchemas are derivable from the published OpenAPI parameters, but
    are not written out here - this is a candidate list, and writing schemas
    would give it the appearance of a shipped server.
