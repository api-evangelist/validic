context: >-
  Worth stating plainly, because the absence is not indifference: Validic has
  invested more in agent-facing surface than most providers in this catalogue.
  It publishes two llms.txt files, an agents.txt router, and two
  agent-directed integration guides written in the second person for an AI
  coding assistant. What it has not done is expose a protocol endpoint. The
  gap between "documentation an agent can read" and "an API an agent can call
  through a protocol" is exactly one MCP server wide.
