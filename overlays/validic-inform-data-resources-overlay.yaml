    - Marketplace & Connections
- target: $.paths[*][?(@.operationId == 'get-connection-events-by-orgid')]
  update:
    tags:
    - Marketplace & Connections
- target: $.paths[*][?(@.operationId == 'get-sources-by-orgid')]
  update:
    tags:
    - Marketplace & Connections
- target: $.paths[*][?(@.operationId == 'get-sources-by-userid')]
  update:
    tags:
