- target: $.paths[*][?(@.operationId == 'cgm')]
  update:
    tags:
    - Observations & Data
- target: $.paths[*][?(@.operationId == 'get-connection-events-by-orgid-1')]
  description: >-
    Rename the cellular ACTIVATE operation. The published spec gives it the
    operationId `get-connection-events-by-orgid-1`, a copy-paste of an
    unrelated read operation - so the two operations in this contract with a
    physical-world consequence are the two with the most misleading names.
  update:
    operationId: activate-cellular-device
    summary: Activate Cellular Device
    tags:
    - Devices
- target: $.paths[*][?(@.operationId == 'get-connection-events-by-orgid-1-1')]
  description: Rename the cellular SUSPEND operation for the same reason.
  update:
    operationId: suspend-cellular-device
    summary: Suspend Cellular Device
    tags:
    - Devices
- target: $.paths[*][?(@.operationId == 'cgm-reports')]
  description: >-
    Flag the stub. `GET /measurements` is declared with no parameters, no
    documented response and a path that does not match the org-scoped
    convention every other operation follows.
  update:
    tags:
    - Observations & Data
    x-api-evangelist-note: >-
      Incomplete operation in the published spec - 421 bytes, no parameters, no
      response schema. Not callable as documented.
