corrections:
- date: '2026-08-15'
  removed:
  - SOC 2
  reason: >-
    A previous pass recorded SOC 2 and ISO 27001 for Validic from a keyword
    match on https://trust.validic.com/ and treated that host as a trust
    centre. Both parts of that were wrong. (1) trust.validic.com is an ATLASSIAN
    STATUSPAGE, not a trust centre - DNS CNAME
    trust.validic.com -> qtyl0stcbvvr.stspg-customer.com, page title "Validic
    Inform Status", live component and incident APIs at /api/v2/*. It is now
    recorded correctly in lifecycle/validic-lifecycle.yml as the status page.
    (2) The strings "SOC 2" and "ISO 27001" appear on that page exactly once
    each, inside an incident notice about Google Health API CASA requirements
    which advises CUSTOMERS to "gather existing certifications - SOC 2 or ISO
    27002 documentation". That is guidance to Validic's customers about THEIR
    own audits; it is not a Validic certification claim. No first-party SOC 2
    assertion exists anywhere on Validic's public surface.
  kept:
  - ISO 27001
  kept_reason: >-
    ISO 27001 survives the correction, but on completely different evidence -
    Validic asserts it directly on validic.com and in its own
    provider-published developer guide.
